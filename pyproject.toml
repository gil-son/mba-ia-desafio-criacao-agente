[project]
name = "residencial-aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora — API com Google ADK"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "google-adk>=2.2.0,<3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "litellm>=1.84",
]
